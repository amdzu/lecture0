<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Ticker</title>
  <link rel="stylesheet" href="index.css">
</head>
<body>
  <div class="wrap wrap--text">
    <p>Ticker</p>
  </div>

  <div class="wrap wrap--logobar" id="containerElem">
    <ul class="list" id="list">
      <li class="list__item"></li>
    </ul>
  </div>

  <section class="inputs">
    <div class="left-controls">
      <div class="stats" aria-hidden="true">
        <span class="stat">
          <span id="wordCountDisplay">0</span>
          <span class="stat-label">words</span>
        </span>
        <span class="stat">
          <span id="durationDisplay">0</span>
          <span class="stat-label">sec</span>
        </span>
      </div>

      <div class="mode-control" role="group" aria-label="speed selection mode">
        <label>
          <input type="radio" name="speedMode" value="slider" checked>
          1-9 Scale
        </label>
        <label>
          <input type="radio" name="speedMode" value="wpm">
          WPM
        </label>
      </div>
    </div>

    <!-- Слайдер скорости с фиксированными делениями -->
    <div class="speed-panel">
      <div class="speed-control" id="sliderControl" role="group" aria-labelledby="speedLabel">
        <div class="speed-row">
          <label id="speedLabel" for="speedRange">Speed</label>
          <input type="range" id="speedRange" min="1" max="9" step="1" list="speedMarks" value="5" />
          <datalist id="speedMarks">
            <option value="1" label="1"></option>
            <option value="2" label="2"></option>
            <option value="3" label="3"></option>
            <option value="4" label="4"></option>
            <option value="5" label="5"></option>
            <option value="6" label="6"></option>
            <option value="7" label="7"></option>
            <option value="8" label="8"></option>
            <option value="9" label="9"></option>
          </datalist>
          <output id="speedValue" for="speedRange">5/9</output>
        </div>
        <div class="tick-labels" aria-hidden="true">
          <span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span>
        </div>
      </div>

      <div class="speed-control speed-control--wpm hidden" id="wpmControl" role="group" aria-labelledby="wpmLabel">
        <label id="wpmLabel" for="wpmSelect">WPM/label>
        <select id="wpmSelect">
          <option value="10">10 wpm</option>
          <option value="20">20 wpm</option>
          <option value="30">30 wpm</option>
          <option value="40">40 wpm</option>
          <option value="50">50 wpm</option>
          <option value="60" selected>60 wpm</option>
          <option value="70">70 wpm</option>
          <option value="80">80 wpm</option>
          <option value="90">90 wpm</option>
          <option value="100">100 wpm</option>
          <option value="120">120 wpm</option>
        </select>
        <output id="wpmValue" for="wpmSelect">60 wpm</output>
      </div>
    </div>

    <div class="right-controls">
      <!-- Красивая кнопка выбора файла + имя файла -->
      <div class="file-control">
        <input id="file" type="file" accept=".txt" onchange="readFile(this)">
        <label for="file" class="btn-file">Upload  text</label>
        <span id="fileName" class="file-name">file not loaded</span>
      </div>

      <!-- Переключатель Турбо-режима (оставлен) -->
      <label class="switch" title="Turbo mode">
        <input id="slider" type="checkbox" aria-label="Turbo mode">
        <span class="slider round"></span>
      </label>
      <div id="turbo"> Turbo mode</div>
    </div>
  </section>

  <button id="btn" class="btn"><div class='warn'>Pause</div></button>

  <script src="index.js"></script>
</body>
</html>
